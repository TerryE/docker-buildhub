# Apache 2.4 Base Configuration

# Context
ServerAdmin       admin@${DOMAIN}
ServerName        ${VHOST}.${DOMAIN}
DefaultRuntimeDir ${APACHE_RUN_DIR}

PidFile           ${APACHE_RUN_DIR}/apache2.pid
User              ${APACHE_RUN_USER}
Group             ${APACHE_RUN_GROUP}

ServerRoot       "/usr/local"
TypesConfig      "/etc/mime.types"

# Modules used to serve the InvisionPower forum application
LoadModule  auth_basic_module     modules/mod_auth_basic.so
LoadModule  authn_core_module     modules/mod_authn_core.so
LoadModule  authn_file_module     modules/mod_authn_file.so
LoadModule  authz_core_module     modules/mod_authz_core.so
LoadModule  authz_host_module     modules/mod_authz_host.so
LoadModule  authz_user_module     modules/mod_authz_user.so
LoadModule  alias_module          modules/mod_alias.so
LoadModule  deflate_module        modules/mod_deflate.so
LoadModule  dir_module            modules/mod_dir.so
LoadModule  env_module            modules/mod_env.so
LoadModule  expires_module        modules/mod_expires.so
LoadModule  evasive_module        modules/mod_evasive.so
LoadModule  filter_module         modules/mod_filter.so
LoadModule  headers_module        modules/mod_headers.so
LoadModule  http2_module          modules/mod_http2.so
LoadModule  log_debug_module      modules/mod_log_debug.so
LoadModule  mime_magic_module     modules/mod_mime_magic.so
LoadModule  mime_module           modules/mod_mime.so
LoadModule  mpm_event_module      modules/mod_mpm_event.so
LoadModule  proxy_module          modules/mod_proxy.so
LoadModule  proxy_fcgi_module     modules/mod_proxy_fcgi.so
LoadModule  reqtimeout_module     modules/mod_reqtimeout.so
LoadModule  rewrite_module        modules/mod_rewrite.so   
LoadModule  unique_id_module      modules/mod_unique_id.so   
LoadModule  setenvif_module       modules/mod_setenvif.so
LoadModule  socache_shmcb_module  modules/mod_socache_shmcb.so
LoadModule  ssl_module            modules/mod_ssl.so
LoadModule  status_module         modules/mod_status.so
LoadModule  info_module           modules/mod_info.so
<IfDefine UseMaxmind>
  LoadModule maxminddb_module     modules/mod_maxminddb.so
</IfDefine>
<IfDefine !UseMaxmind>
  LoadModule geoip_module         modules/mod_geoip.so
</IfDefine>

# Timeout and timing resilience
RequestReadTimeout    header=20-40,MinRate=500 body=20,MinRate=500
Timeout                  120
KeepAlive                 On
MaxKeepAliveRequests     100
KeepAliveTimeout           5

# MPM event worker definitions
StartServers               3
ServerLimit               15
MinSpareThreads           75
MaxSpareThreads          250
ThreadsPerChild           25
ThreadLimit               64
MaxRequestWorkers        300
MaxConnectionsPerChild 10000

# Include sub configs
Include   conf/extra/HTTPtoHTTPS.conf
Include   conf/extra/evasive.conf
Include   conf/extra/ssl.conf

# Logging to host-mounted files (your correct choice)
LogFormat   "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
ErrorLog    ${APACHE_LOG_DIR}/error.log
CustomLog   ${APACHE_LOG_DIR}/access.log combined

# PHP-FPM status info available remotely to logged in users

<Location "/fpm-status">
    Require       all denied
    Require       ip ${APACHE_ADMIN_IP}
    ProxyPass "unix:/var/run/php/php-fpm.sock|fcgi://php:9000"
</Location>

# Forward proxy to php for known php scripts that exist (no other variants supported)
SetEnvIfNoCase ^Authorization$ "(.+)" HTTP_AUTHORIZATION=$1
<FilesMatch ".+\.php$">
    <If "-f %{REQUEST_FILENAME}">
        SetHandler "proxy:unix:/var/run/php/php-fpm.sock|fcgi://php:9000"
    </If>
</FilesMatch>
<FilesMatch "^\.ph(ar|p|ps|tml)$">
    Require all denied
</FilesMatch>

