# === Primary VHOST and www Alias ===
SSLSessionCache         "shmcb:/run/ussl_scache(512000)"
SSLSessionCacheTimeout  300

# Define the custom log format for blocked countries at the global level
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{COUNTRY_CODE}e: Blocked County\"" geoblock_log

Listen 443	
<VirtualHost ${HOST_IP}:443>
    Protocols       h2 http/1.1

    ServerName      ${VHOST}.${DOMAIN}
    ServerAlias     www.${DOMAIN}
    ServerAdmin     webmaster@localhost
    DocumentRoot    /var/www/ipb 
    LogLevel        warn
    CustomLog       ${APACHE_LOG_DIR}/${VHOST}_access.log combined
    ErrorLog        ${APACHE_LOG_DIR}/${VHOST}_error.log

# SSL/TLS optimized for current browsers
    SSLEngine           on
    SSLProtocol         all -SSLv3 -TLSv1 -TLSv1.1 +TLSv1.2 +TLSv1.3
    SSLCipherSuite      ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA256:DHE-RSA-AES128-GCM-SHA256
    SSLHonorCipherOrder on
    SSLCompression      off
    SSLSessionTickets   off
    SSLUseStapling      off
    SSLCertificateFile      /etc/letsencrypt/live/forum.${DOMAIN}/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/forum.${DOMAIN}/privkey.pem
    LogLevel            ssl:warn

# Redirect www subdomain
    <If "%{HTTP_HOST} == 'www.${DOMAIN}'">
        RedirectPermanent / https://${VHOST}.${DOMAIN}/
    </If>
  
# Add Security Headers
    Header always set   Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set   X-Content-Type-Options    "nosniff"
    Header always set   X-Frame-Options           "SAMEORIGIN"
    Header always set   X-XSS-Protection          "1; mode=block"
    Header always set   Referrer-Policy           "strict-origin-when-cross-origin"
    Header always set   Permissions-Policy        "geolocation=(), microphone=(), camera=()"
    Header always unset X-Powered-By

    RewriteEngine on
# LogLevel debug rewrite:trace5
 
# Use either MaxMind or GeoIP to set COUNTRY_CODE based on IP 
    <IfDefine UseMaxmind>
        MaxMindDBEnable On
        MaxMindDBFile COUNTRY_DB ${APACHE_GEO_MMDB}
        # This sets the same variable name as the old module
        MaxMindDBEnv COUNTRY_CODE COUNTRY_DB/country/iso_code
    </IfDefine>
    <IfDefine !UseMaxmind>
        GeoIPEnable On
        GeoIPDBFile /usr/share/GeoIP/GeoIP.dat
        # Use SetEnvIf to create the same variable name
        SetEnvIf GEOIP_COUNTRY_CODE ^(.*)$ COUNTRY_CODE=$1
    </IfDefine>
# LogMessage "Country: %{ENV:COUNTRY_CODE}"
# Cond chain to bypass GeoBlock: Admin IPs, then Google IPs then Allowed Countries
    Include       etc/apache2/ReqireAdminIPs.conf
    Include       conf/extra/google-ips.conf
    RewriteCond   %{ENV:COUNTRY_CODE} !^(BD|BR|HK|IN|ID|IQ|PK|RU|SA|SG|VN)$
    # Last skips the GeoBlock
    RewriteRule   ^                   -                            [S=1]
    # Otherwise: Block
    RewriteRule   ^                   -                            [F,E=GEO_BLOCKED:1]

    CustomLog     ${APACHE_LOG_DIR}/geo_blocked.log geoblock_log   env=GEO_BLOCKED

    # The following is a ladder of 4 regexs in a VHOST context which set ROBOTS to 1..4
    # 1.  The "high value" URIs which Google should index/follow
    # 2.  Multimedia / binary uploads which should be skipped
    # 3.  Other uploads (mostly JPEGS) which Google can index
    # 4.  Anything else including explicit index.php requests are skipped
 
    RewriteRule     ^/($|blogs/|forums?/|topic/|announcements/|guidelines/) -   [E=ROBOTS:1,S=3]
    RewriteRule     ^\.(mp3|mp4|mov|qt|tif|pdf|zip|rar)$                   -   [E=ROBOTS:2,S=2]
    RewriteRule     ^\.(?!php)\w{2,4}$                                     -   [E=ROBOTS:3,S=1]
    RewriteRule     ^                                                      -   [E=ROBOTS:4]

    # Note that the Docroot directory checks still apply so missing files will 403, etc.  
    # Note that the catch-all rewrite to index.php below triggers an internal redirect, so 
    # ROBOTS gets moved to REDIRECT_ROBOTS hence concats below pick up either variant
 
    Header set X-Robots-Tag "index, follow, archive, max-image-preview:large" \
        "expr='%{ENV:ROBOTS}%{ENV:REDIRECT_ROBOTS}' == '1'"
    Header set X-Robots-Tag "noindex" \
        "expr='%{ENV:ROBOTS}%{ENV:REDIRECT_ROBOTS}' == '2'"
    Header set X-Robots-Tag "index" \
        "expr='%{ENV:ROBOTS}%{ENV:REDIRECT_ROBOTS}' == '3'"
    Header set X-Robots-Tag "noindex, nofollow" \
        "expr='%{ENV:ROBOTS}%{ENV:REDIRECT_ROBOTS}' == '4'"

# Apache server status & info
    <Location "/server-info">
        Require       all denied
        Require       ip ${APACHE_ADMIN_IP}
        SetHandler    server-info
    </Location>
    
    <Location "/server-status">
        Require       all denied
        Require       ip ${APACHE_ADMIN_IP}
        SetHandler    server-status
    </Location>

# Access Control & GeoIP for Documents in the DocRoot hierarchy
    <Directory /var/www/ipb/>
        Options         -MultiViews
        AllowOverride   None
        DirectoryIndex  index.php
        RewriteBase     /

        # Prevent the index.php catch-all from breakingi the server handlers
        RewriteRule     ^(server-info|server-status)  -   [END]

        # URIs which have common extentions must refer to a real file
        RewriteCond     %{REQUEST_FILENAME}     !-f
        RewriteRule     \.(js|css|jpeg|jpg|gif|png|ico|map)(\?|$) /404error.php  [END]
        
        # Anything else that isn't a directory or file is passed to the IP suite catch-all
        RewriteCond     %{REQUEST_FILENAME}     !-f 
        RewriteCond     %{REQUEST_FILENAME}     !-d
        RewriteRule     .   index.php           [END]

        # Compression
        AddOutputFilterByType DEFLATE text/html text/css application/javascript application/x-javascript

        # Caching
        ExpiresActive   On
        ExpiresDefault  "now plus 1 month"
        ExpiresByType   text/html               "now plus 0 days"
        ExpiresByType   text/css                "now plus 1 week"
        ExpiresByType   application/javascript  "now plus 1 week"
        FileETag        MTime Size

    </Directory>
    
 # Forum Uploads must be a real file that isn't executed as a script
    <Directory /var/www/ipb/uploads>
        Options     -MultiViews

        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule \.(js|css|jpeg|jpg|gif|png|ico|map)(\?|$) /404error.php [END]

        <FilesMatch "^.*\.(php\d?|cgi|pl|phtml|shtml|([a-z0-9]{32}))$">
            Require all denied
        </FilesMatch>
    </Directory>

# The forum API access requires HTTP(S) Authorisation
    <Directory /var/www/ipb/api>
        SetEnvIf Authorization .+ HTTP_AUTHORIZATION=$0
        Options -MultiViews
        RewriteBase /api/
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule .* index.php [E=HTTP_AUTHORIZATION:%{HTTP:Authorization},L]
    </Directory>

</VirtualHost>

# === Catch-All VHOST ===
<VirtualHost _default_:443>
    ServerAlias     *
    ServerAdmin     webmaster@localhost
    LogLevel        warn
    CustomLog       ${APACHE_LOG_DIR}/catchall_access.log combined
    ErrorLog        ${APACHE_LOG_DIR}/catchall_error.log
    SSLEngine               on
    SSLCertificateFile      /etc/letsencrypt/live/forum.${DOMAIN}/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/forum.${DOMAIN}/privkey.pem

# Return 503 for all invalid hostnames.  Note that the certificate is for the forum, test and 
# www subdomains, so guest browser need to disable cert checks to get this far. 
    RewriteEngine   On
    RewriteRule     .*  -   [R=503,L,END]
    ErrorDocument 503 "Service Unavailable - Invalid hostname"
</VirtualHost>

