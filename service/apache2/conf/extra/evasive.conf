#Mod-evasive Rules
    DOSHashTableSize     3097
    DOSPageCount         2
    DOSSiteCount         50
    DOSPageInterval      1
    DOSSiteInterval      2
    DOSBlockingPeriod    60
    DOSWhitelist         127.0.0.1
    DOSLogDir           "${APACHE_LOG_DIR}/mod_evasive"

    # Custom response (Apache 2.4 enhanced error handling)
    DOSSystemCommand    "su - forum -c 'echo %s >> ${APACHE_LOG_DIR}/mod_evasive/blocked_ips.log'"
