Listen 80
<VirtualHost *:80>
    ServerName ${VHOST}.${DOMAIN}
    ServerAlias www.${DOMAIN}

    # Handle ACME challenge (For Certbot Renewal)
    Alias "/.well-known/acme-challenge/" "/var/www/acme/.well-known/acme-challenge/"
    <Directory "/var/www/acme/.well-known/acme-challenge/">
        Require all granted
        Options None
        AllowOverride None
    </Directory>

    # Suppress logging for ACME challenge requests to reduce log noise
    SetEnvIf  Request_URI  "^/\.well-known/acme-challenge/" dontlog
    CustomLog ${APACHE_LOG_DIR}/http_access.log combined env=!dontlog
    ErrorLog  ${APACHE_LOG_DIR}/http_error.log

    RewriteEngine On
    
    # Block directory traversal attempts, and known dangerous or non-existent paths
    RewriteCond %{REQUEST_URI} \.\. [NC,OR]
    RewriteCond %{REQUEST_URI} ^/(cgi-bin|icons|static|webeditor|plugins)(/|$) [NC]
    RewriteRule ^              -    [R=403,END]
    
    # Redirect all non-cerbot traffic to HTTPS
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^              https://${VHOST}.${DOMAIN}%{REQUEST_URI} [R=301,L,END]

</VirtualHost>
